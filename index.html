<title>WRECKED</title>

<style>
/* Layout: the live ravine fight fills the screen; one left-docked menu card over it; a slim HUD while playing. */
:root {
  --bg: #14110d;
  --panel: rgba(22, 18, 13, 0.88);
  --ink: #f3ead8;
  --muted: #b9ad94;
  --line: rgba(243, 234, 216, 0.14);
  --banana: #ffc23a;
  --danger: #ff6a3d;
  --font-display: "Rubik Distressed", "Arial Black", "Trebuchet MS", system-ui, sans-serif;
  --font-logo: "Rubik Wet Paint", "Rubik Distressed", "Arial Black", sans-serif;
  --font-body: "Barlow Condensed", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#start {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  width: max-content; max-width: calc(100% - 32px); display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 14px 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; text-align: center; pointer-events: none;
}
#starthint { margin: 0; font: 700 20px var(--font-body); letter-spacing: 0.02em; }
button { font: 700 18px var(--font-body); letter-spacing: 0.02em; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 11px 18px; cursor: pointer; pointer-events: auto; }
button.primary { background: var(--banana); border-color: var(--banana); color: #2a1a05; font-size: 26px; padding: 14px 34px; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.status { margin: 0; font-size: 15px; line-height: 1.45; color: var(--muted); max-width: 46ch; }
#hud { position: fixed; inset: 0; pointer-events: none; }
.hud-top {
  position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  display: flex; gap: 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 18px; font-family: var(--font-display); font-size: 20px; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.hud-top small { font: 500 12px var(--font-body); color: var(--muted); margin-right: 4px; }
#xhair { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; border: 2px solid var(--ink); }
#hmsg { position: absolute; left: 0; right: 0; top: 28%; text-align: center; font-family: var(--font-display); font-size: clamp(34px, 8vw, 70px); color: var(--banana); text-shadow: 0 4px 0 #6b3d12; padding-inline: 16px; }
.hud-bot { position: absolute; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); width: min(320px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 4px; align-items: center; }
.hud-bot span { font-size: 14px; color: var(--ink); text-shadow: 0 1px 2px rgba(0,0,0,0.7); }
.bar { width: 100%; height: 12px; border-radius: 999px; background: rgba(0,0,0,0.45); overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; width: 0%; background: var(--danger); }
#hko { position: absolute; inset: 0; background: rgba(20, 10, 0, 0.45); }
#hhint { position: absolute; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; font-size: 15px; text-shadow: 0 1px 2px rgba(0,0,0,0.7); padding-inline: 16px; }
@media (max-width: 520px) { .hud-top { font-size: 16px; gap: 10px; } }
</style>

<div id="hud">
  <div class="hud-top"><span id="hnet"></span><span><small>Round</small><b id="hround">Yard</b></span><span><small id="halivelbl">Apes left</small><b id="halive">6</b></span><span id="htime">2:00</span></div>

</div>
